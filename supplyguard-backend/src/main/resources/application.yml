server:
  port: 8085

spring:
  application:
    name: supplyguard-backend

  # MySQL JPA Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/supplyguard_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:Dhanush1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/supplyguard_mongo

  # Mail Settings (Optional real SMTP, defaults to simulated dispatch)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:freefiregodtamil@gmail.com}
    password: ${MAIL_PASSWORD:nfivttulpjbfzowr}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# SendGrid API Real Email Delivery Configuration
sendgrid:
  api:
    key: ${SENDGRID_API_KEY:SG.placeholder_api_key}
  from:
    email: ${SENDGRID_FROM_EMAIL:alerts@supplyguard.ai}
    name: ${SENDGRID_FROM_NAME:SupplyGuard Autonomous Procurement}

# Security & JWT
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 Hours

# Ollama AI Reasoning Configuration
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3}
  timeout-seconds: 15
  fallback-enabled: true

# Vapi AI Outbound Voice Call Configuration
vapi:
  api:
    key: ${VAPI_API_KEY:a93b965c-24a5-4270-8294-16d1fb4e9453}
  assistant:
    id: ${VAPI_ASSISTANT_ID:bc490953-b036-4e7e-824d-2029a26013e9}
  phone:
    number:
      id: ${VAPI_PHONE_NUMBER_ID:c8e6322c-c5b4-44b2-a887-289bddea37fa}
  base-url: ${VAPI_BASE_URL:https://api.vapi.ai}

# Logging
logging:
  level:
    root: INFO
    com.supplyguard: DEBUG
    org.hibernate.SQL: WARN

