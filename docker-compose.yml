version: '3.8'

services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: supplyguard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Dhanush1}
      MYSQL_DATABASE: supplyguard_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MongoDB
  mongodb:
    image: mongo:6.0
    container_name: supplyguard-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Spring Boot Backend
  backend:
    build:
      context: ./supplyguard-backend
      dockerfile: Dockerfile
    container_name: supplyguard-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/supplyguard_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Dhanush1}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/supplyguard_mongo
      SPRING_MAIL_USERNAME: ${GMAIL_USERNAME:-freefiregodtamil@gmail.com}
      SPRING_MAIL_PASSWORD: ${GMAIL_APP_PASSWORD:-nfivttulpjbfzowr}
      VAPI_API_KEY: ${VAPI_API_KEY:-a93b965c-24a5-4270-8294-16d1fb4e9453}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-bc490953-b036-4e7e-824d-2029a26013e9}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-c8e6322c-c5b4-44b2-a887-289bddea37fa}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    ports:
      - "8085:8085"

  # 4. React Vite Frontend
  frontend:
    build:
      context: ./supplyguard-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8085/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8085/ws}
    container_name: supplyguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  mongo_data:
